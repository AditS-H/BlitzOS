# GRUB configuration for BlitzOS
#
# The `module2` lines matter as much as the kernel line. GRUB loads each named
# file into memory and describes it to the kernel through a multiboot2 tag; the
# string after the path becomes the module's command line, which BlitzOS uses as
# a filename. kernel/exec/elf.c copies each one into the ramfs under /bin.
#
# This is how compiled programs reach the OS before there is any disk driver:
# the bootloader is the filesystem.

set timeout=3
set default=0

menuentry "BlitzOS" {
    multiboot2 /boot/kernel.bin
    module2 /boot/bin/hello hello
    module2 /boot/bin/demo demo
    boot
}

menuentry "BlitzOS (no user programs)" {
    multiboot2 /boot/kernel.bin
    boot
}
